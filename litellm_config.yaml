# ── ASIS LiteLLM Proxy Configuration (OPTIONAL — not used in default deployment)
# ─────────────────────────────────────────────────────────────────────────────
# By default ASIS calls Groq directly (no proxy needed — all models same endpoint).
# Use this file ONLY if you want to:
#   - Add paid providers alongside Groq (OpenAI, Anthropic, etc.)
#   - Route specific agents to different providers
#   - Enable cost tracking / budget limits across providers
#
# To activate: uncomment the litellm service in docker-compose.yml and set
# LLM_BASE_URL=http://litellm:4000 in the backend/celery-worker environment.
#
# ── Current Groq model assignments (free, no credit card) ────────────────────
# Orchestrator        → llama-3.1-8b-instant          Groq  (ultra-fast routing)
# Market Intelligence → llama-3.3-70b-versatile        Groq  (best quality research)
# Risk Assessment     → deepseek-r1-distill-llama-70b  Groq  (R1 chain-of-thought)
# Financial Reasoning → deepseek-r1-distill-llama-70b  Groq  (R1 arithmetic)
# Competitor Analysis → llama-3.3-70b-versatile        Groq  (research + analysis)
# Synthesis           → llama-3.1-8b-instant           Groq  (fast brief assembly)
# ─────────────────────────────────────────────────────────────────────────────

model_list:

  # ── Groq free tier models (current deployment) ────────────────────────────

  - model_name: llama-3.3-70b-versatile
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/LLM_API_KEY

  - model_name: llama-3.1-8b-instant
    litellm_params:
      model: groq/llama-3.1-8b-instant
      api_key: os.environ/LLM_API_KEY

  - model_name: deepseek-r1-distill-llama-70b
    litellm_params:
      model: groq/deepseek-r1-distill-llama-70b
      api_key: os.environ/LLM_API_KEY

  # ── Upgrade path: add paid providers here when ready ─────────────────────
  # Example — DeepSeek API (cheapest frontier model, ~$0.14/1M tokens):
  # - model_name: deepseek-v3-strategic
  #   litellm_params:
  #     model: deepseek/deepseek-chat
  #     api_key: os.environ/DEEPSEEK_API_KEY
  #
  # Example — OpenRouter (aggregates 200+ models, pay-per-use):
  # - model_name: qwen3-235b-market-intel
  #   litellm_params:
  #     model: openrouter/qwen/qwen3-235b-a22b
  #     api_key: os.environ/OPENROUTER_API_KEY
  #     extra_headers:
  #       HTTP-Referer: http://34.172.33.24:8000
  #       X-Title: ASIS Strategic Intelligence System

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  drop_params: true

litellm_settings:
  drop_params: true
  num_retries: 3
  request_timeout: 120

router_settings:
  num_retries: 3
  retry_after: 5
  timeout: 120
  routing_strategy: "latency-based-routing"
