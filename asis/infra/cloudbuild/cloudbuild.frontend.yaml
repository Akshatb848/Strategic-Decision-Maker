steps:
  # ── Step 1: Build the frontend Docker image ───────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-frontend
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend:${COMMIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend:latest"
      - "--build-arg"
      - "NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}"
      - "asis/frontend/"

  # ── Step 2: Push the image to Artifact Registry ───────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-frontend
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend"

  # ── Step 3: Deploy to Cloud Run ───────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-frontend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - asis-frontend
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend:${COMMIT_SHA}"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=3000"
      - "--cpu=1"
      - "--memory=512Mi"
      - "--min-instances=0"
      - "--max-instances=10"
      - "--set-env-vars=NEXT_PUBLIC_API_URL=${_NEXT_PUBLIC_API_URL}"

substitutions:
  _REGION: asia-south1
  _PROJECT_ID: ${PROJECT_ID}
  _NEXT_PUBLIC_API_URL: https://asis-backend-api-xxxxxxxxxx-el.a.run.app/api/v1

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend:${COMMIT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/frontend:latest"
