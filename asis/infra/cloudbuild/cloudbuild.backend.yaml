steps:
  # ── Step 1: Build the backend Docker image ────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-backend
    args:
      - build
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend:${COMMIT_SHA}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend:latest"
      - "asis/backend/"

  # ── Step 2: Push the image to Artifact Registry ───────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: push-backend
    args:
      - push
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend"

  # ── Step 3: Deploy to Cloud Run ───────────────────────────────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-backend
    entrypoint: gcloud
    args:
      - run
      - deploy
      - asis-backend-api
      - "--image=${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend:${COMMIT_SHA}"
      - "--region=asia-south1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--port=8000"
      - "--cpu=2"
      - "--memory=2Gi"
      - "--min-instances=1"
      - "--max-instances=20"
      - "--set-env-vars=GCP_PROJECT_ID=${_PROJECT_ID},GCP_REGION=${_REGION},ENVIRONMENT=production"

  # ── Step 4: Smoke test — verify /v1/health responds 200 ──────────────────
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: smoke-test
    entrypoint: bash
    args:
      - "-c"
      - |
        BACKEND_URL=$(gcloud run services describe asis-backend-api \
          --region=asia-south1 \
          --format='value(status.url)')
        echo "Backend URL: $BACKEND_URL"
        HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/v1/health")
        echo "Health check status: $HTTP_STATUS"
        if [ "$HTTP_STATUS" != "200" ]; then
          echo "Smoke test FAILED — expected 200 got $HTTP_STATUS"
          exit 1
        fi
        echo "Smoke test PASSED"

substitutions:
  _REGION: asia-south1
  _PROJECT_ID: ${PROJECT_ID}

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend:${COMMIT_SHA}"
  - "${_REGION}-docker.pkg.dev/${_PROJECT_ID}/asis/backend:latest"
