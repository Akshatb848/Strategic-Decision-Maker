# ── ASIS v4.0 — Production Compose ────────────────────────────────────────────
# LLM provider: Groq (groq.com) — completely free, no credit card, fastest
# inference in the world. Set LLM_API_KEY=gsk_... in .env before starting.
#
# ── Per-agent model assignments (Groq free tier) ──────────────────────────────
# Orchestrator        → llama-3.1-8b-instant         (ultra-fast routing/decomposition)
# Market Intelligence → llama-3.3-70b-versatile      (best quality, deep research)
# Risk Assessment     → deepseek-r1-distill-llama-70b (R1 reasoning, COSO analysis)
# Financial Reasoning → deepseek-r1-distill-llama-70b (R1 reasoning, NPV/IRR math)
# Competitor Analysis → llama-3.3-70b-versatile      (research + Porter analysis)
# Synthesis           → llama-3.1-8b-instant         (fast final brief assembly)
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Data Stores ──────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asis
      POSTGRES_PASSWORD: asis
      POSTGRES_DB: asis
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # ── Observability ─────────────────────────────────────────────────────────────

  langfuse:
    image: langfuse/langfuse:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://asis:asis@postgres:5432/asis
      NEXTAUTH_URL: http://34.172.33.24:3001
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-change-me-langfuse-secret}
      SALT: ${LANGFUSE_SALT:-change-me-langfuse-salt}
      TELEMETRY_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Workflow Automation ───────────────────────────────────────────────────────

  n8n:
    build:
      context: ./asis/n8n
      dockerfile: Dockerfile
    ports:
      - "5678:5678"
    environment:
      # ── Database ──────────────────────────────────────────────────────────────
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: asis
      DB_POSTGRESDB_USER: asis
      DB_POSTGRESDB_PASSWORD: asis
      # ── n8n core ──────────────────────────────────────────────────────────────
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      WEBHOOK_URL: http://34.172.33.24:5678
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-changeme-n8n-encryption-key-32c}
      EXECUTIONS_MODE: regular
      N8N_SKIP_WEBHOOK_DEREGISTRATION_SHUTDOWN: "true"
      # ── ASIS integration (available in workflows as $env.*) ───────────────────
      ASIS_API_URL: http://backend:8000
      ASIS_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-changeme-n8n-secret-32chars-min}
      N8N_WEBHOOK_BASE_URL: http://34.172.33.24:5678
      ASIS_DEFAULT_COMPANY: ${ASIS_DEFAULT_COMPANY:-Acme Corp}
      ASIS_DEFAULT_SECTOR: ${ASIS_DEFAULT_SECTOR:-technology}
      ASIS_DEFAULT_GEOGRAPHY: ${ASIS_DEFAULT_GEOGRAPHY:-India}
      ASIS_DEFAULT_TENANT: "00000000-0000-0000-0000-000000000001"
      # ── External APIs (optional — used by WF05/WF07) ──────────────────────────
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started   # service_healthy races with _check_llm timeout
    volumes:
      - n8n_data:/home/node/.n8n
      - ./asis/n8n/workflows:/workflows:ro
    restart: always

  # ── Application Services ──────────────────────────────────────────────────────

  backend:
    build:
      context: ./asis/backend
    image: ghcr.io/akshatb848/strategic-decision-maker/backend:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://asis:asis@postgres:5432/asis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      ALLOWED_ORIGINS: "http://34.172.33.24:3000"
      # ── LLM: Groq free tier — set LLM_API_KEY=gsk_... in .env ────────────────
      # Sign up free at groq.com → Console → API Keys (no credit card needed)
      LLM_BASE_URL: "https://api.groq.com/openai/v1"
      # ── Per-agent model assignments ───────────────────────────────────────────
      # Orchestrator: ultra-fast 8B for query routing + MECE decomposition
      ORCHESTRATOR_MODEL: "llama-3.1-8b-instant"
      # Market Intelligence: best-quality 70B for PESTLE + Porter's Five Forces
      MARKET_INTEL_MODEL: "llama-3.3-70b-versatile"
      # Risk: DeepSeek R1 distill — chain-of-thought for COSO ERM severity scoring
      RISK_MODEL: "deepseek-r1-distill-llama-70b"
      # Financial: DeepSeek R1 distill — step-by-step NPV/IRR/payback arithmetic
      FINANCIAL_MODEL_NAME: "deepseek-r1-distill-llama-70b"
      # Competitor: 70B versatile for Porter gap analysis + named benchmark data
      COMPETITOR_MODEL: "llama-3.3-70b-versatile"
      # Synthesis: fast 8B assembles all 5 agent outputs → board-ready brief
      SYNTHESIS_MODEL: "llama-3.1-8b-instant"
      # Defaults for unresolved overrides
      CLAUDE_MODEL: "llama-3.3-70b-versatile"
      CLAUDE_HAIKU_MODEL: "llama-3.1-8b-instant"
      CLAUDE_MAX_TOKENS: "6000"
      JWT_EXPIRE_MINUTES: "10080"
      # ── Observability (disable until Langfuse keys are configured) ─────────────
      # To enable: create an org in the Langfuse UI (port 3001), copy the keys,
      # then set LANGFUSE_PUBLIC_KEY + LANGFUSE_SECRET_KEY in .env and flip this.
      LANGFUSE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always
    healthcheck:
      # Simple TCP liveness probe — is port 8000 open? Much faster than urlopen /v1/health
      # (health endpoint runs _check_llm which makes a real Groq API call; with Docker's
      # 10s timeout that races and consistently fails. /v1/health is for monitoring only.)
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(5); s.connect(('localhost',8000)); s.close()\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./asis/frontend
      args:
        NEXT_PUBLIC_API_URL: http://34.172.33.24:8000/v1
    image: ghcr.io/akshatb848/strategic-decision-maker/frontend:latest
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://34.172.33.24:8000/v1
    depends_on:
      - backend
    restart: always

  celery-worker:
    build:
      context: ./asis/backend
    image: ghcr.io/akshatb848/strategic-decision-maker/backend:latest
    command: celery -A asis.backend.tasks.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://asis:asis@postgres:5432/asis
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_URL: http://qdrant:6333
      LANGFUSE_HOST: http://langfuse:3000
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      LLM_BASE_URL: "https://api.groq.com/openai/v1"
      ORCHESTRATOR_MODEL: "llama-3.1-8b-instant"
      MARKET_INTEL_MODEL: "llama-3.3-70b-versatile"
      RISK_MODEL: "deepseek-r1-distill-llama-70b"
      FINANCIAL_MODEL_NAME: "deepseek-r1-distill-llama-70b"
      COMPETITOR_MODEL: "llama-3.3-70b-versatile"
      SYNTHESIS_MODEL: "llama-3.1-8b-instant"
      CLAUDE_MODEL: "llama-3.3-70b-versatile"
      CLAUDE_HAIKU_MODEL: "llama-3.1-8b-instant"
      CLAUDE_MAX_TOKENS: "6000"
      LANGFUSE_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  n8n_data:
