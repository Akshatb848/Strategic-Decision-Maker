name: Build & Push Docker Images

# Builds backend + frontend on GitHub Actions (fast internet, GH cache).
# Deploys to GCP VM via SSH — no docker compose build on VM ever again.
#
# Required GitHub Secrets (Settings -> Secrets -> Actions):
#   VM_SSH_KEY  private SSH key (~/.ssh/github_actions on VM)
#   VM_HOST     VM public IP, e.g. 34.172.33.24
#   VM_USER     VM login user, e.g. major_project848
#   VM_DIR      repo path on VM, e.g. /home/major_project848/Strategic-Decision-Maker

on:
  push:
    branches:
      - claude/asis-multi-agent-system-Lc2Zq
      - main
    paths:
      - "asis/backend/**"
      - "asis/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/backend
  FRONTEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/frontend

jobs:
  # ── Build backend ──────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./asis/backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build frontend ─────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ./asis/frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://34.172.33.24:8000/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to GCP VM ───────────────────────────────────────────────────────
  # Strategy A (primary): VM pulls images from GHCR authenticated with the
  #   ephemeral GITHUB_TOKEN passed over SSH.
  # Strategy B (fallback): if GHCR is unreachable from VM, the runner pulls
  #   images locally then pipes them directly to the VM via docker save | ssh.
  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      # ── Setup SSH ─────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VM_SSH_KEY }}" > ~/.ssh/vm_key
          chmod 600 ~/.ssh/vm_key
          ssh-keyscan -H "${{ secrets.VM_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Strategy A: pull from GHCR on VM ─────────────────────────────────
      - name: Deploy via GHCR pull (primary)
        id: deploy_ghcr
        continue-on-error: true
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "set -e
             cd '${{ secrets.VM_DIR }}'
             git pull origin '${{ github.ref_name }}'
             echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
             docker compose pull backend frontend
             docker compose up -d --no-build backend celery-worker frontend
             docker compose ps"

      # ── Strategy B: stream images over SSH pipe (fallback) ────────────────
      - name: Login to GHCR on runner (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend to runner (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        run: docker pull "${{ env.BACKEND_IMAGE }}:latest"

      - name: Pull frontend to runner (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        run: docker pull "${{ env.FRONTEND_IMAGE }}:latest"

      - name: Stream backend to VM via SSH pipe (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        run: |
          docker save "${{ env.BACKEND_IMAGE }}:latest" | gzip | \
            ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "gunzip | docker load"

      - name: Stream frontend to VM via SSH pipe (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        run: |
          docker save "${{ env.FRONTEND_IMAGE }}:latest" | gzip | \
            ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
              "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
              "gunzip | docker load"

      - name: Restart services on VM (fallback)
        if: steps.deploy_ghcr.outcome == 'failure'
        run: |
          ssh -i ~/.ssh/vm_key -o StrictHostKeyChecking=no \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" \
            "set -e
             cd '${{ secrets.VM_DIR }}'
             git pull origin '${{ github.ref_name }}'
             docker compose up -d --no-build backend celery-worker frontend
             docker compose ps"
