name: Build & Push Docker Images

# Architecture:
#   build-backend / build-frontend: run on GitHub-hosted runners (fast internet,
#     GH cache). Build images and push to GHCR. Takes ~5 min total.
#
#   deploy: runs on the self-hosted runner installed ON the GCP VM.
#     The runner polls GitHub over outbound HTTPS — no inbound SSH port needed.
#     Pulls the pre-built GHCR images (authenticated with GITHUB_TOKEN), then
#     restarts containers. If GHCR is unreachable, falls back to local build
#     using Docker's BuildKit cache (fast after first run).
#
# One-time VM setup (run these commands on the GCP VM, see README):
#   mkdir -p ~/actions-runner && cd ~/actions-runner
#   curl -Lo runner.tar.gz https://github.com/actions/runner/releases/download/v2.322.0/actions-runner-linux-x64-2.322.0.tar.gz
#   tar xzf runner.tar.gz
#   ./config.sh --url https://github.com/Akshatb848/Strategic-Decision-Maker --token <TOKEN> --name asis-gcp-vm --unattended
#   sudo ./svc.sh install && sudo ./svc.sh start
#
# Get <TOKEN> from: GitHub repo -> Settings -> Actions -> Runners -> New self-hosted runner -> Linux

on:
  push:
    branches:
      - claude/asis-multi-agent-system-Lc2Zq
      - main
    paths:
      - "asis/backend/**"
      - "asis/frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/build-images.yml"
  workflow_dispatch:

env:
  BACKEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/backend
  FRONTEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/frontend

jobs:
  # ── Build backend on GitHub-hosted runner (fast internet + GH cache) ────────
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./asis/backend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build frontend on GitHub-hosted runner ──────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./asis/frontend
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://34.172.33.24:8000/v1
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy: runs ON the GCP VM via self-hosted runner ───────────────────────
  # No SSH, no open ports. Runner polls GitHub over outbound HTTPS.
  deploy:
    runs-on: [self-hosted]
    needs: [build-backend, build-frontend]
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/backend
      FRONTEND_IMAGE: ghcr.io/akshatb848/strategic-decision-maker/frontend
    steps:
      - name: Pull latest code
        run: |
          cd "${{ secrets.VM_DIR }}"
          git pull origin "${{ github.ref_name }}"

      - name: Deploy — pull from GHCR, fall back to local build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -e
          cd "${{ secrets.VM_DIR }}"

          echo "=== Authenticating to GHCR ==="
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

          if docker compose pull backend frontend; then
            echo "=== GHCR pull succeeded — restarting with pre-built images ==="
            docker compose up -d --no-build backend celery-worker frontend
          else
            echo "=== GHCR pull failed — building locally (BuildKit wheel cache active) ==="
            DOCKER_BUILDKIT=1 docker compose build backend
            docker compose up -d backend celery-worker frontend
          fi

          echo "=== Final container status ==="
          docker compose ps
