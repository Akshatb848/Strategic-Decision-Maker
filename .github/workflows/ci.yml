name: CI

on:
  push:
    branches: [claude/asis-multi-agent-system-Lc2Zq]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway CI database: trust auth, so no password is stored anywhere
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: asis_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Settings are validated at import time; these are dummy, non-secret values.
      ENVIRONMENT: development
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      TEST_DATABASE_URL: "postgresql+asyncpg://postgres@localhost:5432/asis_test"
      JWT_SECRET: "ci-test-secret-at-least-32-characters-long"
      REDIS_URL: "redis://localhost:6379/0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: asis/backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r asis/backend/requirements.txt aiosqlite ruff==0.8.6
      - name: Ruff (syntax errors and undefined names)
        run: ruff check asis/backend --select E9,F63,F7,F82
      - name: Pytest (schemas + API routes against PostgreSQL)
        run: |
          pytest -c asis/backend/tests/pytest.ini asis/backend/tests \
            --cov=asis/backend --cov-report=term -v

  frontend:
    name: Frontend — type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: asis/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: asis/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
