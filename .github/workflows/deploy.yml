name: Deploy to GCP

on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-south1' }}

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Submit backend Cloud Build
        run: |
          gcloud builds submit \
            --config=asis/infra/cloudbuild/cloudbuild.backend.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }},_REGION=${{ env.GCP_REGION }},_PROJECT_ID=${{ env.GCP_PROJECT_ID }} \
            .

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Submit frontend Cloud Build
        run: |
          gcloud builds submit \
            --config=asis/infra/cloudbuild/cloudbuild.frontend.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }},_REGION=${{ env.GCP_REGION }},_PROJECT_ID=${{ env.GCP_PROJECT_ID }},_NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            .
