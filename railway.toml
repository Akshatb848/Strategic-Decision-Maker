[build]
builder = "DOCKERFILE"

# ── Backend service ────────────────────────────────────────────────────────────
[[services]]
name = "backend"
source = "asis/backend"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
startCommand = "uvicorn asis.backend.api.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[services.env]
ENVIRONMENT = "production"
PYTHONPATH = "/app"

# ── Frontend service ───────────────────────────────────────────────────────────
[[services]]
name = "frontend"
source = "asis/frontend"

[services.build]
dockerfilePath = "Dockerfile"

[services.deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
